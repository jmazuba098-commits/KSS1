
<!DOCTYPE html>
<html>
<head>
<title>KSS Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
body{font-family:Arial;padding:15px;background:#f5f5f5}
h2{background:#1a237e;color:white;padding:15px;border-radius:8px}
table{width:100%;border-collapse:collapse;background:white;margin-top:10px}
th,td{border:1px solid #ccc;padding:10px;text-align:left}
th{background:#eee}
#error{color:red;background:#ffebee;padding:10px;border-radius:5px;display:none}

</style>
</head>
<body>
<h2>Kamulanga Secondary - Logins</h2>
<p id="count">Loading...</p>
<p id="error"></p>
<table id="table"><tr><th>ID</th><th>Email</th><th>Date</th></tr></table>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.39.0/dist/umd/supabase.min.js"></script>
<script>
const SUPABASE_URL = 'https://chsgaawibbfgvvwbmzhn.supabase.co';
const SUPABASE_KEY = 'sb_publishable_b9aVNIpA0PifX2rF0n7L4Q_C9wa9dqp';
const client = supabase.createClient(SUPABASE_URL, 

SUPABASE_KEY);

async function load(){
 try {
   const {data, error} = await client.from('logins').select('*').order('created_at', {ascending:false});
   if(error) throw error;
   document.getElementById('count').innerText = 'Total: ' + data.length;
   const t = document.getElementById('table');
   data.forEach(r => {
     t.innerHTML += `<tr><td>${r.id}</td><td>${r.email}</td><td>${new Date(r.created_at).toLocaleString()}</td></tr>`;
   });
 } catch(e) {
   

document.getElementById('count').innerText = 'Failed to load';
   const err = document.getElementById('error');
   err.style.display = 'block';
   err.innerText = 'Error: ' + e.message;
 }
}
load();
</script>
</body>
</html>
