
<!DOCTYPE html>
<html><head><title>KSS Admin</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>body{font-family:Arial;padding:15px} table{width:100%;border-collapse:collapse} th,td{border:1px solid #ccc;padding:8px;text-align:left} th{background:#eee}</style>
</head><body>
<h2>Kamulanga Secondary - Logins</h2>
<p id="count">Loading...</p>
<table id="table"><tr><th>ID</th><th>Email</th><th>Date</th></tr></table>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<script>
const supabase = 

window.supabase.createClient('https://chsgaawibbfgvvwbmzhn.supabase.co','sb_publishable_b9aVNIpA0PifX2rF0n7L4Q_C9wa9dqp');
async function load(){
 const {data,error}=await supabase.from('logins').select('*').order('created_at',{ascending:false});
 if(error){document.getElementById('count').innerText=error.message;return;}
 document.getElementById('count').innerText='Total: '+data.length;
 const t=document.getElementById('table');
 data.forEach(r=>{t.innerHTML+=`<tr><td>${r.id}</td><td>${r.email}</td><td>${new Date(r.created_at).toLocaleString()}</td></tr>`});
}
load();

</script>
</body></html>
